<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel desativado</title>
<style>
  :root { --bg: #faf8f7; --ink: #1d1a19; --muted: #6b6461; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151413; --ink: #efebe8; --muted: #a9a29d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); max-width: 420px; }
</style>
</head>
<body>
  <main>
    <h1>Este painel foi desativado</h1>
    <p>O Painel de Campanhas 2027 agora fica no Claude. Peça o link à equipe de marketing do 60 Minutos.</p>
  </main>
</body>
</html>
